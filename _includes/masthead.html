<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="primary-nav" class="site-nav-simple">
        <a class="site-nav-brand" href="{{ site.baseurl }}/">{{ site.author.name }}</a>
        <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-menu" aria-label="Open navigation">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <div class="site-nav-panel" id="site-nav-menu">
          <ul class="site-nav-links">
            {% for link in site.data.navigation.main %}
            <li>
              <a href="{{ site.baseurl }}{{ link.url }}"{% if page.url contains link.url %} class="active" aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
            {% endfor %}
            {% if site.author.googlescholar %}
            <li class="site-nav-icon">
              <a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener" title="Google Scholar"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i><span>Google Scholar</span></a>
            </li>
            {% endif %}
            <li class="site-nav-icon">
              <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-fw fa-github" aria-hidden="true"></i><span>GitHub</span></a>
            </li>
            <li class="site-nav-icon">
              <a href="mailto:{{ site.author.email }}" title="Email"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i><span>Email</span></a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </div>
</div>
